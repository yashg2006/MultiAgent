[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "generate_da1\\.py"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["generate_da1.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["generate_da1\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["generate_da1.py"]

[tool.mutmut]
paths_to_mutate = ["src/shared/retry.py", "src/shared/resilience.py"]
