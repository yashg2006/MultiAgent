name: Python Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres and Redis for the integration pass below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multiagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff mypy

    - name: Lint (ruff)
      run: ruff check .

    - name: Format check (black)
      run: black --check .

    - name: Type check (mypy)
      run: mypy src --ignore-missing-imports

    - name: Run pytest with coverage
      run: |
        set +e
        pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -rfE -q > pytest.txt 2>&1
        code=$?
        tail -40 pytest.txt
        if [ $code -ne 0 ]; then
          # Make the failure summary visible as annotations (CI logs are not
          # downloadable from every environment).
          sed -n '/=\{3,\} \(FAILURES\|ERRORS\) =\{3,\}/,/=\{3,\} short test summary/p' pytest.txt \
            | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' \
            | sed 's/^/::error title=pytest failures::/'
          grep -E "^(FAILED|ERROR)" pytest.txt | sed 's/%/%25/g; s/^/::error title=pytest::/'
        fi
        exit $code

    # Surface coverage as a check-run annotation + job summary so it is visible
    # on the PR page (and readable via the GitHub API) without downloading the
    # artifact: one notice with the total, one with the per-module breakdown.
    - name: Report coverage
      run: |
        TOTAL=$(python -m coverage report --format=total)
        echo "::notice title=Coverage total::${TOTAL}% line coverage of src/"
        PER_MODULE=$(python -m coverage report | sed ':a;N;$!ba;s/\n/%0A/g')
        echo "::notice title=Coverage by module::${PER_MODULE}"
        {
          echo "### Coverage: ${TOTAL}%"
          echo '```'
          python -m coverage report
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # Same database/queue tests again, on Postgres instead of SQLite and with a
    # real Redis + arq worker round trip (skipped in the first pass).
    - name: Integration tests (Postgres + Redis)
      env:
        TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/multiagent_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        python -m pytest tests/test_api.py tests/test_auth.py tests/test_worker.py tests/test_migrations.py tests/test_observability.py \
          -p no:cacheprovider -q -rs --junitxml=integration.xml
        python - <<'PY'
        import xml.etree.ElementTree as ET
        suite = ET.parse("integration.xml").getroot()
        suite = suite if suite.tag == "testsuite" else suite[0]
        total, fail, err, skip = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
        print(f"::notice title=Integration tests (Postgres + Redis)::{total - fail - err - skip}/{total} passed, {skip} skipped")
        PY

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    # No lockfile is committed yet (the first dev environment had no npm
    # registry access); package.json pins exact versions, so `npm install` is
    # reproducible enough until a package-lock.json is added.
    - name: Install dependencies
      run: npm install --no-audit --no-fund

    # Failures are re-emitted as annotations so they show on the PR page.
    - name: Type check (tsc)
      run: |
        if ! npx tsc --noEmit --pretty false > tsc.txt 2>&1; then
          head -30 tsc.txt | sed 's/%/%25/g; s/^/::error title=tsc::/'
          exit 1
        fi

    - name: Unit tests (vitest)
      run: |
        npx vitest run --reporter=default --reporter=github-actions --reporter=json --outputFile=vitest.json
        node -e "const r=require('./vitest.json'); console.log('::notice title=Frontend tests::' + r.numPassedTests + '/' + r.numTotalTests + ' passed')"

    - name: Production build (vite)
      run: |
        if ! npx vite build > build.txt 2>&1; then
          tail -30 build.txt | sed 's/%/%25/g; s/^/::error title=vite build::/'
          exit 1
        fi
        tail -8 build.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=Build output::/'

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    # Dependency audits. Reported as annotations; an upstream advisory we can't
    # fix shouldn't block the build, so these don't hard-fail.
    - name: Python dependency audit (pip-audit)
      run: |
        python -m pip install --upgrade pip pip-audit
        pip install -r requirements.txt
        pip-audit --progress-spinner off 2>&1 | tee pip-audit.txt || true
        echo "::notice title=pip-audit::$(grep -cE '^[A-Za-z0-9_.-]+ +[0-9]' pip-audit.txt || echo 0) vulnerable package line(s); see log"

    - name: Node dependency audit (npm audit)
      working-directory: frontend
      run: |
        npm install --no-audit --no-fund
        npm audit --audit-level=high 2>&1 | tee ../npm-audit.txt || true
        echo "::notice title=npm audit::$(grep -c 'vulnerabilities' ../npm-audit.txt || echo 0) summary line(s); see log"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Write compose env
      run: |
        cat > .env <<ENV
        JWT_SECRET=e2e-ci-secret-$GITHUB_RUN_ID
        POSTGRES_PASSWORD=postgres
        LLM_PROVIDER=mock
        SEARCH_TOOL=none
        FRONTEND_PORT=8080
        ENV

    - name: Build and start the stack
      run: |
        # Core services only (no Prometheus/Grafana) for a faster E2E run.
        # MOCK_LATENCY makes runs last a few seconds so the live view and
        # cancellation are exercised.
        MOCK_LATENCY_SECONDS=1.2 docker compose up --build -d \
          postgres redis migrate api worker frontend
        echo "Waiting for the frontend to answer..."
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8080/ > /dev/null 2>&1; then echo "up after ${i}s"; break; fi
          sleep 2
        done
        curl -fsS http://localhost:8080/ready || (docker compose logs api | tail -40; exit 1)

    - name: Install Playwright and run E2E
      working-directory: frontend
      env:
        BASE_URL: http://localhost:8080
      run: |
        npm install --no-audit --no-fund
        npx playwright install --with-deps chromium
        if npx playwright test; then
          echo "::notice title=E2E::Playwright end-to-end tests passed"
        else
          echo "::error title=E2E::Playwright end-to-end tests failed"
          docker compose -f ../docker-compose.yml logs api worker | tail -80
          exit 1
        fi

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        if-no-files-found: ignore

    - name: Scan the backend image (Trivy)
      if: always()
      continue-on-error: true
      run: |
        # Install the Trivy CLI (avoids pinning a marketplace-action tag).
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
          --exit-code 0 --no-progress multiagent-api:latest | tee trivy.txt
        echo "::notice title=Trivy::$(grep -cE 'CVE-' trivy.txt || echo 0) HIGH/CRITICAL fixable finding line(s) in the backend image"

    - name: Stop the stack
      if: always()
      run: docker compose down -v
