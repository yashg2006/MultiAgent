name: Python Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff mypy

    - name: Lint (ruff)
      run: ruff check .

    - name: Format check (black)
      run: black --check .

    - name: Type check (mypy)
      run: mypy src --ignore-missing-imports

    - name: Run pytest with coverage
      run: |
        pytest --cov=src --cov-report=term-missing --cov-report=xml

    # Surface coverage as a check-run annotation + job summary so it is visible
    # on the PR page (and readable via the GitHub API) without downloading the
    # artifact: one notice with the total, one with the per-module breakdown.
    - name: Report coverage
      run: |
        TOTAL=$(python -m coverage report --format=total)
        echo "::notice title=Coverage total::${TOTAL}% line coverage of src/"
        PER_MODULE=$(python -m coverage report | sed ':a;N;$!ba;s/\n/%0A/g')
        echo "::notice title=Coverage by module::${PER_MODULE}"
        {
          echo "### Coverage: ${TOTAL}%"
          echo '```'
          python -m coverage report
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
