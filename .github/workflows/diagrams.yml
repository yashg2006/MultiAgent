name: Diagrams

# Renders the Mermaid sources in diagrams/ to PNGs under docs/assets/diagrams/
# and commits any changes, so the images in the docs always match their source.

on:
  push:
    branches: ["main", "develop"]
    paths: ["diagrams/**.mmd", ".github/workflows/diagrams.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11

      - name: Render diagrams
        run: |
          mkdir -p docs/assets/diagrams
          printf '{ "args": ["--no-sandbox"] }' > /tmp/puppeteer.json
          for f in diagrams/*.mmd; do
            name=$(basename "$f" .mmd)
            mmdc -i "$f" -o "docs/assets/diagrams/${name}.png" \
              -p /tmp/puppeteer.json -b white -s 2
          done

      - name: Commit rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/diagrams/
          if git diff --cached --quiet; then
            echo "Diagrams already up to date."
          else
            git commit -m "docs: re-render diagrams [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
