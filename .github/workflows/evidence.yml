name: Evidence

# Generates the benchmark and load-test numbers used in docs/.
# Manually triggered so the (optional, paid) real-LLM run is deliberate.
# With no ANTHROPIC_API_KEY secret it falls back to the free Mock provider,
# and every run commits its raw results back to the branch it ran on.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider for the benchmark (mock = free, anthropic = uses the secret)"
        type: choice
        options: [mock, anthropic]
        default: mock
      task_limit:
        description: "How many of the 15 benchmark tasks to run"
        type: string
        default: "15"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib

      - name: Resolve provider
        id: prov
        env:
          REQUESTED: ${{ github.event.inputs.provider }}
          HAVE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$REQUESTED" = "anthropic" ] && [ "$HAVE_KEY" != "true" ]; then
            echo "::warning::anthropic requested but ANTHROPIC_API_KEY is not set; using mock."
            echo "provider=mock" >> "$GITHUB_OUTPUT"
          else
            echo "provider=$REQUESTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmark
        env:
          LLM_PROVIDER: ${{ steps.prov.outputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-5-5
          SEARCH_TOOL: wikipedia
        run: |
          python scripts/benchmark.py --out docs/results --limit "${{ github.event.inputs.task_limit }}"

      - name: Render report table and chart
        env:
          PROVIDER: ${{ steps.prov.outputs.provider }}
        run: |
          python scripts/report_benchmark.py "docs/results/benchmark-${PROVIDER}.json" \
            --md "docs/results/benchmark-${PROVIDER}.md" \
            --chart "docs/assets/benchmark-${PROVIDER}.png"

      - name: Summarize to the run page
        env:
          PROVIDER: ${{ steps.prov.outputs.provider }}
        run: cat "docs/results/benchmark-${PROVIDER}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        env:
          PROVIDER: ${{ steps.prov.outputs.provider }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results/ docs/assets/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "docs: benchmark results (${PROVIDER}) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          cp .env.docker.example .env
          docker compose up -d --build

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ready || true)
            if [ "$code" = "200" ]; then echo "ready after ${i} tries"; exit 0; fi
            sleep 2
          done
          echo "::error::API never became ready"; docker compose ps; docker compose logs --tail=80
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture UI screenshots
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p ../docs/assets/screenshots
          npx playwright test --config=playwright.screenshots.config.ts

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/ || true
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "docs: capture UI screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  loadtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          cp .env.docker.example .env
          docker compose up -d --build

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ready || true)
            if [ "$code" = "200" ]; then echo "ready after ${i} tries"; exit 0; fi
            sleep 2
          done
          echo "::error::API never became ready"; docker compose ps; docker compose logs --tail=80
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Locust
        run: pip install locust

      - name: Run load test
        run: |
          mkdir -p docs/results
          locust -f scripts/locustfile.py --host http://localhost:8080 \
            --headless -u 20 -r 5 -t 1m --only-summary \
            --csv docs/results/loadtest | tee docs/results/loadtest.txt

      - name: Summarize to the run page
        run: |
          echo '### Load test (20 users, 1 min, Mock provider)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat docs/results/loadtest_stats.csv >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "docs: load-test results [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
