server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API and auth proxied to the api service. SSE needs buffering off and a
    # long read timeout so the event stream isn't cut or batched.
    location ~ ^/(tasks|auth|health|ready) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
